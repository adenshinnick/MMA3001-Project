[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket6dof"
version = "1.0.0"
description = "six-degree-of-freedom rocket flight simulator (MMA3001 project)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]
license = "MIT"
readme = "README.md"

[tool.setuptools.packages.find]

where =["src"]